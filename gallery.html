<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maïssane - Gallery</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <style>
        .gallery-masonry img {
            position: relative;
            display: block; /* Évite les décalages de ligne */
            cursor: pointer;
            transition: opacity 0.3s ease;
        }

        .gallery-masonry img:hover {
            opacity: 0.8;
        }

        /* Fondu blanc lors de la navigation vers un projet (SPA index.html) */
        #page-fade {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #ffffff;
            z-index: 9999;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease;
        }

        #page-fade.active {
            opacity: 1;
        }

        /* Désactiver le curseur sur mobile/tablette */
        @media (max-width: 1024px) {
            .cursor-follower {
                display: none !important;
            }
        }

    </style>
</head>
<body class="is-gallery">
    <div class="cursor-follower"></div>

    <header class="site-header">
        <nav>
            <div class="nav-left">
                <a href="gallery.html" class="nav-item">WORK</a>
            </div>
            <div class="nav-right">
                <a href="#" class="nav-item" id="contact-btn">JOIN</a>
                <a href="info.html" class="nav-item">INFO</a>
            </div>
        </nav>
    </header>

    <div class="expertise-list">
        <span>ARTISTIC DIRECTION</span>
        <span>ILLUSTRATION</span>
        <span>GRAPHIC DESIGN</span>
        <span>BRANDING</span>
        <span>TYPOGRAPHY</span>
        <span>SCENOGRAPHY</span>
        <span>MOTION DESIGN</span>
        <span>PACKAGING</span>
        <span>POSTER</span>
        <span>EDITORIAL</span>
        <span>ARTIFICIAL INTELLIGENCE</span>
        <span>PHOTO EDITING</span>
        <span>FILM DIRECTOR</span>
        <span>WEBSITE</span>
    </div>

    <main class="hero">
        <div class="logo-container">
            <a href="index.html">
                <img src="projets/logo/anim_logovf.gif" alt="Maïssane Animated Logo" class="animated-main-logo">
            </a>
        </div>

        <section class="gallery-section">
            <div class="gallery-masonry">
                <!-- Une image par projet : le clic ouvre le projet correspondant dans la SPA (index.html) -->
                <img src="projets/gallery/work/visuel_02.webp" alt="Tha" data-project="tha">
                <img src="projets/gallery/work/adsb01.webp" alt="Andersson Bell" data-project="andersson_bell">
                <img src="projets/gallery/work/visuel_10.webp" alt="Créolisation" data-project="creolisation">
                <img src="projets/gallery/work/ultuure.webp" alt="The Culture Evolves" data-project="the_culture_evolves">
                <img src="projets/gallery/work/street04.webp" alt="Osaka" data-project="osaka">
                <img src="projets/gallery/work/keblack_post_0-07.webp" alt="Keblack" data-project="keblack">
                <img src="projets/gallery/work/memoire_post_05.webp" alt="Mémoire" data-project="memoire">
                <img src="projets/gallery/work/madamemo_poster.webp" alt="MadameMo" data-project="madamemo">
                <img src="projets/gallery/work/05.webp" alt="Posters" data-project="posters">
                <img src="projets/gallery/work/visuel_07.webp" alt="Sinequanon" data-project="sinequanon">
                <img src="projets/gallery/work/visuel_06.webp" alt="Sunburn" data-project="sunburn">
                <img src="projets/gallery/work/cop1_05.webp" alt="COP1" data-project="cop1">
                <img src="projets/gallery/work/dici_images-05.webp" alt="Agence Dici" data-project="agence_dici">
                <img src="projets/gallery/work/jardin_7.webp" alt="Jardin des exilées" data-project="jardin_des_exilees">
            </div>
            <footer class="site-footer">Copyright © 2026 Atelier MDD</footer>
        </section>
    </main>

    <div id="page-fade"></div>

    <div id="contact-overlay">
        <div class="overlay-content">
            <div class="contact-details">
                <span class="contact-item">Let's work together</span>
                <a href="mailto:maissane.dia@gmail.com" class="contact-item contact-email">maissane.dia@gmail.com</a>
                <a href="tel:+33618434195" class="contact-item contact-phone">+33 6 18 43 41 95</a>
                <a href="https://www.linkedin.com/in/maïssane-dia-deverre-a1b712229/" target="_blank" class="contact-item contact-linkedin">LinkedIn</a>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const workImages = document.querySelectorAll('.gallery-masonry img');
            const fade = document.getElementById('page-fade');

            // Clic sur une image WORK : fondu blanc puis ouverture du projet dans la SPA (index.html)
            workImages.forEach(img => {
                img.addEventListener('click', () => {
                    const project = img.dataset.project;
                    if (!project) return;
                    fade.classList.add('active');
                    setTimeout(() => {
                        window.location.href = `index.html?project=${project}`;
                    }, 500);
                });
            });
        });
    </script>
</body>
</html>
